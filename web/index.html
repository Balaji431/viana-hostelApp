<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Saveetha Hostels">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Saveetha Hostels">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Saveetha Hostels</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="index.css">

  <style>
    body {
      background-color: #f5f0e8;
      background-image:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px),
        linear-gradient(180deg, #f5f0e8 0%, #e8e0d5 100%);
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }

    .bg-linen-grid {
      background-color: #f5f0e8;
      background-image:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px),
        linear-gradient(180deg, #f5f0e8 0%, #e8e0d5 100%);
      background-attachment: fixed;
    }
  </style>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        if (registrations.length > 0) {
          var promises = [];
          for (var i = 0; i < registrations.length; i++) {
            promises.push(registrations[i].unregister());
          }
          Promise.all(promises).then(function() {
            console.log('All service workers unregistered. Reloading...');
            window.location.reload();
          });
        } else {
          loadBootstrap();
        }
      }).catch(function() {
        loadBootstrap();
      });
    } else {
      loadBootstrap();
    }
    
    function loadBootstrap() {
      // Dynamically load flutter_bootstrap.js with cache-buster query parameter
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?t=' + new Date().getTime();
      script.async = true;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
