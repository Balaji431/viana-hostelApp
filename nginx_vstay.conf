# HTTP → HTTPS redirect
server {
    listen 80;
    server_name vstay.saveetha.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name vstay.saveetha.com;
    client_max_body_size 100M;
    ssl_certificate /etc/letsencrypt/live/vstay.saveetha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vstay.saveetha.com/privkey.pem;

    # Modern SSL configuration (drop legacy TLS 1.0/1.1 to prevent renegotiation)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upstream Gzip Compression
    # NOTE: gzip_vary is intentionally omitted here — the frontend container's
    # nginx/default.conf already adds "Vary: Accept-Encoding". Adding it here
    # too would produce a duplicate Vary header in the proxied response.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/wasm
        image/svg+xml
        font/woff
        font/woff2
        font/ttf
        font/otf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /db/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docker/ {
        proxy_pass https://127.0.0.1:9443/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
