services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: balaji182/vstay-frontend:latest
    container_name: hostel_frontend
    ports:
      - "8080:80"
    environment:
      - API_BASE_URL=https://vstay.saveetha.com/api/
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: balaji182/vstay-backend:latest
    container_name: hostel_backend
    ports:
      - "8081:80"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./hostel_backend:/var/www/html
      - backend_uploads:/var/www/html/uploads
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: hostel_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=stay_simats
      - MYSQL_USER=${DB_USER:-user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hostel_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - UPLOAD_LIMIT=500M

  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket_php
    image: balaji182/vstay-websocket:latest
    container_name: hostel_websocket
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_NAME=stay_simats
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - LOG_LEVEL=debug
    ports:
      - "3001:3001"
    volumes:
      - ./hostel_backend:/var/www/html
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: hostel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  db_data:
  backend_uploads:
  redis_data: