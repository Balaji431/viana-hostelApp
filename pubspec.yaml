name: vianasoft_stay
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  intl: ^0.20.2
  google_fonts: ^8.1.0
  http: ^1.2.1
  shared_preferences: ^2.5.4
  uuid: ^4.2.1
  url_launcher: ^6.3.0

  # Hive for local caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picker & CSV for bulk import
  file_picker: ^8.0.0
  csv: ^6.0.0

  # DataTable2 for desktop data grids
  data_table_2: ^2.5.15

  # 🔥 Firebase (Xcode 16 compatible versions)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^17.1.2
  
  # 🔥 LIVE CALLING (Native Dialer Transition)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.1.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.jpg
    - assets/images/login_bg.jpg
