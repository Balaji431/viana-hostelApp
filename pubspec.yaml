name: vianasoft_stay
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+27

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  intl: ^0.20.2
  google_fonts: ^8.1.0
  http: ^1.2.1
  shared_preferences: ^2.5.4
  uuid: ^4.2.1
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1

  # Hive for local caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picker & CSV for bulk import
  file_picker: ^8.0.0
  csv: ^6.0.0
  archive: ^3.6.1

  # Image picker for custom wallpapers
  image_picker: ^1.1.2

  # Camera for Face Attendance
  camera: ^0.11.0+2

  # Real ML face detection (Android & iOS) — no server needed
  google_mlkit_face_detection: ^0.12.0

  # DataTable2 for desktop data grids
  data_table_2: ^2.5.15

  # 🔥 Firebase (Xcode 16 compatible versions)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^17.1.2
  excel: ^4.0.6
  
  # 🔥 Real-Time WebSockets & Socket.IO
  web_socket_channel: ^3.0.1
  socket_io_client: ^2.0.3+1
  in_app_update: ^4.2.5
  
  # 📍 Attendance Geolocation, Security & Hardware Keystore
  geolocator: ^12.0.0
  flutter_secure_storage: ^9.2.2
  network_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.1.3

dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.jpg
    - assets/images/login_bg.jpg
    - assets/wallpapers/
    - assets/docs/
