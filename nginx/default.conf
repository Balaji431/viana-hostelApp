
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── TCP / connection optimisations ──────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 200;

    # ── File cache — avoids repeated stat() / open() syscalls ───────────────
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Runtime gzip ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/wasm
        application/octet-stream
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject
        font/ttf
        font/otf;

    # ── Proxy backend PHP API requests ──────────────────────────────────────
    location ~ \.php$ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy /api/ requests ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy uploads folder ─────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Proxy WebSocket requests ──────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://websocket:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Flutter SPA routing ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Never cache index.html (always revalidate for new deploys) ───────────
    # NOTE: No 'expires' directive — expires -1 auto-generates its own
    # Cache-Control: no-cache header, duplicating the add_header below.
    # add_header is the single source of truth.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Never cache runtime config ───────────────────────────────────────────
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Never cache service workers / bootstrap ──────────────────────────────
    location ~* (flutter_bootstrap\.js|flutter_service_worker\.js|firebase-messaging-sw\.js) {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── 7-day revalidation cache for main app bundle ─────────────────────────
    # Browser uses ETag to skip re-download on unchanged builds.
    # Only 1 directive — no duplication possible.
    location = /main.dart.js {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── 1-year immutable cache for all other hashed static assets ───────────
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── 1-year immutable cache for all OTHER .js assets (not main.dart.js) ──
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
