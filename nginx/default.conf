
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── TCP / connection optimisations ──────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;   # batch headers + first data chunk together (fewer round trips)
    tcp_nodelay     on;   # disable Nagle for small responses (lower latency)
    keepalive_timeout 65; # keep connections alive — critical for mobile reuse
    keepalive_requests 200;

    # ── File cache — avoids repeated stat() / open() syscalls ───────────────
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Runtime gzip — works through production reverse proxies ─────────────
    # NOTE: gzip_static intentionally NOT used — Nginx Proxy Manager re-processes
    # Content-Encoding: gzip and corrupts large files.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;      # balanced: fast enough, good ratio
    gzip_min_length   256;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/wasm
        application/octet-stream
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject
        font/ttf
        font/otf;

    # ── Flutter SPA routing ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Long-lived cache for all hashed static assets ───────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Never cache runtime config ───────────────────────────────────────────
    location = /config.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Never cache service workers / bootstrap entry points ────────────────
    location ~* (main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|firebase-messaging-sw\.js) {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /firebase-messaging-sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Never cache index.html ───────────────────────────────────────────────
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
