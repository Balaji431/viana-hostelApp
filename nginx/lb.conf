# ── Docker internal DNS resolver (required for dynamic upstream resolution) ──
# This lets nginx resolve backend1/backend2 at request time, not startup.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── Simple sticky round-robin via two separate location splits ───────────────
# We use a variable-based proxy_pass so Docker DNS resolves lazily.
# Split traffic ~50/50 using the request millisecond as a simple hash.

map $request_id $backend_host {
    ~[02468ace]  backend1;
    default      backend2;
}

server {
    listen 80;
    server_name localhost;

    # ── TCP optimisations ─────────────────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Gzip compression on backend responses ────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        application/json
        text/plain
        text/csv
        application/octet-stream;

    # ── Route to backend via lazy DNS variable proxy ──────────────────────────
    location / {
        set $upstream http://$backend_host:80;

        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        proxy_buffering         on;
        proxy_buffer_size       16k;
        proxy_buffers           8 32k;
        proxy_busy_buffers_size 64k;

        # Retry on failure — routes to the other backend
        proxy_next_upstream error timeout http_502 http_503;
    }
}
